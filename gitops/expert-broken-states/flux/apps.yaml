apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apptique-broken-states
  namespace: flux-system
spec:
  interval: 5m
  path: ./gitops/expert-broken-states/apps/apptique/overlays/healthy
  prune: true
  sourceRef:
    kind: GitRepository
    name: apptique-examples
  targetNamespace: apptique-broken-states
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: frontend
      namespace: apptique-broken-states
