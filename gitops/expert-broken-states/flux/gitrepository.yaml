apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: apptique-examples
  namespace: flux-system
spec:
  interval: 1m
  url: https://github.com/confighub/examples
  ref:
    branch: main
  # Each parent is re-included before its children are excluded again, so
  # this means the same to git check-ignore as to source-controller: a path
  # under an excluded directory cannot otherwise be re-included.
  ignore: |
    /*
    !/gitops/
    /gitops/*
    !/gitops/expert-broken-states/
