# Layer 1. Nothing else on this cluster reconciles until this one is ready.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  path: ./gitops/flux/expert-fleet/infrastructure/prod
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: fleet-repo
