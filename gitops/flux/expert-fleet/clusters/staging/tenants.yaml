# Layer 3. Tenants come after infrastructure, and are applied with their own
# ServiceAccount, so a tenant cannot reach the platform layer.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tenants
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure
  interval: 10m
  path: ./gitops/flux/expert-fleet/tenants/staging
  prune: true
  sourceRef:
    kind: GitRepository
    name: fleet-repo
