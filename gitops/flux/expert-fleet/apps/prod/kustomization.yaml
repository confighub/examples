apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: apptique-prod

resources:
  - ../base/apptique
  - namespace.yaml

labels:
  - pairs:
      environment: prod

images:
  - name: nginx
    newTag: 1.26.3-alpine

patches:
  - target:
      kind: Deployment
      name: frontend
    patch: |
      - op: replace
        path: /spec/replicas
        value: 4
