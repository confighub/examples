apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: apptique-dev

resources:
  - ../base/apptique
  - namespace.yaml

labels:
  - pairs:
      environment: dev

images:
  - name: nginx
    newTag: 1.27.3-alpine # {"$imagepolicy": "flux-system:apptique:tag"}

patches:
  - target:
      kind: Deployment
      name: frontend
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
