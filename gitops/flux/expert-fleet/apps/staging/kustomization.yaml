apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: apptique-staging

resources:
  - ../base/apptique
  - namespace.yaml

labels:
  - pairs:
      environment: staging

images:
  - name: nginx
    newTag: 1.27.2-alpine

patches:
  - target:
      kind: Deployment
      name: frontend
    patch: |
      - op: replace
        path: /spec/replicas
        value: 2
