# One platform component delivered as a chart. The HelmRelease is the only
# object in Git; the rendered workload only exists after Flux reconciles it.
# A tool that reads this repo should say so rather than pretending it knows
# what the chart produces.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: edge-router
  namespace: ingress-system
spec:
  interval: 30m
  chart:
    spec:
      chart: edge-router
      version: "2.4.x"
      sourceRef:
        kind: HelmRepository
        name: platform-charts
        namespace: flux-system
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    replicaCount: 1
    service:
      type: LoadBalancer
