# The platform-owned bootstrap layer. No serviceAccountName is set here, so
# this Kustomization reconciles with the kustomize-controller's own default
# identity, the same trusted identity every cluster-level layer in this
# repo set uses. That is what makes this a platform piece and not a tenant
# piece: it is the only object in this example allowed to create namespaces,
# RoleBindings and quotas across more than one team.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tenants
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  path: ./gitops/flux/expert-multi-tenant/tenants/base
  prune: true
  # Not "wait: true". This layer applies each team's GitRepository and
  # Kustomization, and with wait on it would only be Ready once every team's
  # own app is healthy. One team's broken Deployment would then mark the
  # platform layer failed. The platform layer is done when its own objects
  # (namespaces, RBAC, quotas, policies, the team's sync objects) are applied.
  wait: false
  sourceRef:
    kind: GitRepository
    name: flux-system
