# The tenant boundary. Everything team-storefront's own Kustomization
# applies is applied as this ServiceAccount, and this RoleBinding is the
# only grant that ServiceAccount has anywhere on the cluster: admin rights,
# scoped to this one namespace. A change from another team's Kustomization
# cannot reach this namespace, whatever their repo says, because no
# RoleBinding anywhere gives them rights here.
apiVersion: v1
kind: Namespace
metadata:
  name: team-storefront
  labels:
    toolkit.fluxcd.io/tenant: team-storefront
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: team-storefront
  namespace: team-storefront
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: team-storefront-reconciler
  namespace: team-storefront
subjects:
  - kind: ServiceAccount
    name: team-storefront
    namespace: team-storefront
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
