# The tenant's own source and their own Kustomization. The important field
# is serviceAccountName: without it, the tenant's manifests would be applied
# with the platform's own rights instead of the tenant's own, narrower
# rights. targetNamespace is the other important field: it has to match the
# namespace rbac.yaml grants this ServiceAccount, or the apply is refused.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: team-storefront
  namespace: team-storefront
spec:
  interval: 5m
  url: https://github.com/confighub/examples
  ref:
    branch: main
  # Each parent is re-included before its children are excluded again, so
  # this means the same to git check-ignore as to source-controller: a path
  # under an excluded directory cannot otherwise be re-included.
  ignore: |
    /*
    !/gitops/
    /gitops/*
    !/gitops/flux/
    /gitops/flux/*
    !/gitops/flux/expert-multi-tenant/
    /gitops/flux/expert-multi-tenant/*
    !/gitops/flux/expert-multi-tenant/tenants/
    /gitops/flux/expert-multi-tenant/tenants/*
    !/gitops/flux/expert-multi-tenant/tenants/base/
    /gitops/flux/expert-multi-tenant/tenants/base/*
    !/gitops/flux/expert-multi-tenant/tenants/base/team-storefront/
    /gitops/flux/expert-multi-tenant/tenants/base/team-storefront/*
    !/gitops/flux/expert-multi-tenant/tenants/base/team-storefront/workloads/
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: team-storefront
  namespace: team-storefront
spec:
  interval: 5m
  path: ./gitops/flux/expert-multi-tenant/tenants/base/team-storefront/workloads
  prune: true
  serviceAccountName: team-storefront
  targetNamespace: team-storefront
  sourceRef:
    kind: GitRepository
    name: team-storefront
