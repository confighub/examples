apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The tenant owns this folder. The platform owns everything above it
# (rbac.yaml, guardrails.yaml, sync.yaml). This team ships one Deployment
# and no Service: not every tenant's shape has to match the others.
resources:
  - deployment.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: team-loyalty
