# The cluster-level policy that keeps one team's traffic and consumption
# inside its own namespace. The platform sets these, not the tenant.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: team-loyalty-quota
  namespace: team-loyalty
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 2Gi
    limits.cpu: "2"
    limits.memory: 4Gi
    pods: "10"
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: team-loyalty-same-namespace-only
  namespace: team-loyalty
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
