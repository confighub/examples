apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure
  interval: 5m
  path: ./gitops/flux/beginner/apps/prod
  prune: true
  sourceRef:
    kind: GitRepository
    name: apptique-examples
  targetNamespace: apptique-prod
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: frontend
      namespace: apptique-prod
