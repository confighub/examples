apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: apptique-dev
  namespace: argocd
  labels:
    app.kubernetes.io/name: apptique
    app.kubernetes.io/instance: apptique-dev
    environment: dev
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    # In this example, app-repo/ and gitops-repo/ are two folders in one
    # example directory so both render and upload together. In a real setup
    # this is a second, separate Git repository: the one CI's pull request
    # targets, never the app repo itself.
    repoURL: https://github.com/confighub/examples.git
    targetRevision: main
    path: gitops/argo/intermediate-ci-to-gitops/gitops-repo/environments/apptique/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: apptique-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
