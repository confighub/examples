apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: mon
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
  - clusters:
      selector:
        matchLabels: {env: prod, region: use1}
        matchExpressions:
        - {key: org, operator: NotIn, values: [gamma]}
      values:
        version: 1.4.0
  - clusters:
      selector:
        matchLabels: {env: prod, region: euw1}
        matchExpressions:
        - {key: org, operator: NotIn, values: [gamma]}
      values:
        version: 1.4.0
  - clusters:
      selector:
        matchLabels: {env: prod, region: aps1}
        matchExpressions:
        - {key: org, operator: NotIn, values: [gamma]}
      values:
        version: 1.4.0
  - clusters:
      selector:
        matchLabels: {env: prod, region: usw2}
        matchExpressions:
        - {key: org, operator: NotIn, values: [gamma]}
      values:
        version: 1.4.0
  - clusters:
      selector:
        matchLabels: {env: dev}
      values:
        version: 1.5.0
  - clusters:
      selector:
        matchLabels: {org: gamma, env: prod}
      values:
        version: 1.3.2
  template:
    metadata:
      name: 'mon-{{.name}}'
      annotations:
        argocd.argoproj.io/manifest-generate-paths: /values/global.yaml
    spec:
      project: default
      destination:
        server: '{{.server}}'
        namespace: monitoring
      sources:
      - repoURL: https://charts.example.invalid
        chart: mon
        targetRevision: '{{.values.version}}'
        helm:
          ignoreMissingValueFiles: true
          valueFiles:
          - $values/values/global.yaml
          - $values/values/org/{{.metadata.labels.org}}.yaml
          - $values/values/environments/{{.metadata.labels.env}}.yaml
          - $values/values/providers/{{.metadata.labels.provider}}.yaml
          - $values/values/clusters/{{.name}}.yaml
      - repoURL: https://git.example.invalid/platform/fleet-config.git
        targetRevision: main
        ref: values
      syncPolicy:
        automated: {selfHeal: true}
