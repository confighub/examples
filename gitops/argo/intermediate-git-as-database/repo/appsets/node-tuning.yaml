apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: node-tuning
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
  - clusters:
      selector:
        matchLabels: {org: acme, env: prod, region: use1}
  template:
    metadata:
      name: 'node-tuning-{{.name}}'
      annotations:
        argocd.argoproj.io/manifest-generate-paths: /values/clusters/acme-prod-use1.yaml
    spec:
      project: default
      destination:
        server: '{{.server}}'
        namespace: kube-system
      source:
        repoURL: https://git.example.invalid/platform/fleet-config.git
        targetRevision: main
        path: charts/node-tuning
        helm:
          valueFiles:
          - ../../values/clusters/acme-prod-use1.yaml
      syncPolicy:
        automated: {selfHeal: true, prune: true}
